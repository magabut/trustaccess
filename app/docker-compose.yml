services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      EID_CLIENT_ID: ${EID_CLIENT_ID:?EID_CLIENT_ID is required}
      EID_CLIENT_SECRET: ${EID_CLIENT_SECRET:?EID_CLIENT_SECRET is required}
      EID_VERIFIER_BASE_URL: ${EID_VERIFIER_BASE_URL:-https://gateway.e.id}
      EID_BASE_URL: ${EID_BASE_URL:-https://api-wallet.e.id}
      EID_LOGIN_VERIFICATION_ID: ${EID_LOGIN_VERIFICATION_ID:?EID_LOGIN_VERIFICATION_ID is required}
      EID_FAKE: ${EID_FAKE:-0}
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const os=require('os');const ip=Object.values(os.networkInterfaces()).flat().find((n)=>n&&n.family==='IPv4'&&!n.internal)?.address||'127.0.0.1';fetch('http://'+ip+':3000/api/health').then((r)=>r.json().then((j)=>{if(!r.ok||!j.ok)process.exit(1);})).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
